# ???????????????????????????????????????????????????????????????????
# CONFIGURAZIONE GENERALE
# ???????????????????????????????????????????????????????????????????

# Utente da usare di default (user1, user2, user3, ecc.)
default.user=user2

# Lista utenti da testare (separati da virgola)
# Esempio: user1,user2,user3 per testare tutti gli utenti
test.users=user2

# Timeout e delay (millisecondi)
wait.short=5000
wait.medium=10000
wait.long=20000

# ???????????????????????????????????????????????????????????????????
# ? CONFIGURAZIONE CICLI RIPETUTI (NUOVO)
# ???????????????????????????????????????????????????????????????????

# Numero di volte che l'intero ciclo di test deve essere ripetuto
# numero.cicli=1  ? Esegue 1 volta (comportamento standard)
# numero.cicli=3  ? Ripete tutto 3 volte
# numero.cicli=10 ? Ripete tutto 10 volte
#
# NOTA: Ogni utente verrà testato per N cicli completi.
#       Se hai 2 utenti abilitati e numero.cicli=3, verranno eseguiti:
#       - 3 cicli per user1 (con tutti i suoi totem)
#       - 3 cicli per user2 (con tutti i suoi totem)
#
# Utile per:
# - Test di stabilità (verificare che i test passino sempre)
# - Test di stress (vedere se ci sono problemi intermittenti)
# - Validazione produzione (cicli multipli per certificazione)
numero.cicli=10

# Pausa tra un ciclo e l'altro (in secondi)
# Dopo ogni ciclo completo, il sistema aspetta N secondi prima di iniziare il prossimo
# Valore consigliato: 5-10 secondi per dare tempo al sistema di stabilizzarsi
pausa.tra.cicli=5

# ???????????????????????????????????????????????????????????????????
# REPORT E COMPORTAMENTO
# ???????????????????????????????????????????????????????????????????

# Genera PDF del report Allure
report.generate_pdf=true

# Apri automaticamente il browser con il report
report.open_browser=true

# Pausa prima di chiudere per visualizzare risultati
# true  = Attende INVIO prima di chiudere (utile per debug)
# false = Chiude automaticamente (utile per CI/CD)
pausa.prima.chiusura=true

