plugins {
    id 'java'
}

group = 'com.bithiatec'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // JUnit 5
    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"

    // Appium + Selenium
    testImplementation "io.appium:java-client:9.3.0"
    testImplementation "org.seleniumhq.selenium:selenium-java:4.26.0"

    // Allure JUnit5
    testImplementation "io.qameta.allure:allure-junit5:2.29.0"
    testImplementation "io.qameta.allure:allure-attachments:2.29.0"
}

def allureResultsDir = file("$buildDir/allure-results")
def allureReportDir  = file("$buildDir/allure-report")

test {
    useJUnitPlatform()

    // Allure results -> build/allure-results
    systemProperty "allure.results.directory", allureResultsDir.absolutePath

    // ✅ evita report vecchi: pulisce prima di ogni run
    doFirst {
        delete allureResultsDir
        delete allureReportDir
    }

    // log verbosi (stile console)
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        exceptionFormat "full"
    }
}

// ✅ genera report HTML sempre aggiornato (richiede Allure CLI nel PATH)
tasks.register("allureReport", Exec) {
    dependsOn test
    commandLine "cmd", "/c", "allure generate \"${allureResultsDir.absolutePath}\" --clean -o \"${allureReportDir.absolutePath}\""
}

// ✅ apre il report in browser (server temporaneo) sempre aggiornato
tasks.register("allureServe", Exec) {
    dependsOn test
    commandLine "cmd", "/c", "allure serve \"${allureResultsDir.absolutePath}\""
}
